<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <!-- Primary Emerald Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Amber Gold Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="60%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6" />
    </linearGradient>

    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Optional Dark Container Frame -->
  <rect x="8" y="8" width="784" height="204" rx="36" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="2" />

  <!-- EMBLEM ICON (Left side offset x=30, y=25, size=170x170) -->
  <g transform="translate(30, 25) scale(0.332)">
    <!-- Geometric Shield Frame -->
    <path d="M 256 64 L 400 136 V 280 C 400 368 336 424 256 448 C 176 424 112 368 112 280 V 136 Z" 
          fill="none" stroke="url(#primaryGrad)" stroke-width="14" stroke-linejoin="round" opacity="0.4" />

    <!-- Inner Shield Core -->
    <path d="M 256 84 L 380 148 V 272 C 380 348 324 398 256 420 C 188 398 132 348 132 272 V 148 Z" 
          fill="#0b1329" stroke="url(#primaryGrad)" stroke-width="8" stroke-linejoin="round" />

    <!-- Crest Motif -->
    <path d="M 256 120 C 275 120 290 100 282 82 C 298 92 312 88 316 72 C 328 92 342 96 348 112 C 330 114 318 126 314 140 Z" fill="url(#amberGrad)" />
    <path d="M 256 120 C 237 120 222 100 230 82 C 214 92 200 88 196 72 C 184 92 170 96 164 112 C 182 114 194 126 198 140 Z" fill="url(#amberGrad)" />

    <!-- Wings -->
    <path d="M 256 150 L 168 320 H 215 L 242 265 H 256 Z" fill="url(#primaryGrad)" />
    <path d="M 256 150 L 344 320 H 297 L 270 265 H 256 Z" fill="url(#cyanGrad)" />

    <!-- Diamond Node -->
    <polygon points="256,180 282,235 256,290 230,235" fill="url(#amberGrad)" />
    <path d="M 190 270 Q 256 240 322 270 L 334 292 Q 256 260 178 292 Z" fill="url(#amberGrad)" />
    <path d="M 190 340 C 230 365 282 365 322 340 C 310 375 278 390 256 390 C 234 390 202 375 190 340 Z" fill="url(#amberGrad)" />
    <circle cx="256" cy="235" r="8" fill="#ffffff" />
  </g>

  <!-- BRAND NAME & TYPOGRAPHY (Right Side x=220) -->
  <!-- "AKHI POS" -->
  <text x="220" y="110" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-weight="900" 
        font-size="68" 
        letter-spacing="2" 
        fill="url(#textGrad)" 
        filter="url(#subtleGlow)">
    AKHI POS
  </text>

  <!-- Enterprise Badge Pill -->
  <rect x="565" y="65" width="175" height="32" rx="16" fill="#1e293b" stroke="url(#amberGrad)" stroke-width="1.5" />
  <text x="652" y="86" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="800" 
        font-size="12" 
        letter-spacing="1.5" 
        fill="#fbbf24" 
        text-anchor="middle">
    PRO EDITION
  </text>

  <!-- Subtitle Line -->
  <text x="222" y="152" 
        font-family="system-ui, -apple-system, sans-serif" 
        font-weight="700" 
        font-size="17" 
        letter-spacing="5" 
        fill="#38bdf8">
    SMART POULTRY &amp; FARM MANAGEMENT
  </text>

  <!-- Tagline bar -->
  <line x1="222" y1="172" x2="740" y2="172" stroke="url(#primaryGrad)" stroke-width="2" opacity="0.6" />
  <circle cx="222" cy="172" r="3" fill="#34d399" />
  <circle cx="740" cy="172" r="3" fill="#38bdf8" />
</svg>
