<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Primary Emerald Teal Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="50%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Amber Gold Gradient -->
    <linearGradient id="amberGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Shield Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#fbbf24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.8" />
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="4" />

  <!-- Geometric Glowing Outer Shield Frame -->
  <path d="M 256 64 L 400 136 V 280 C 400 368 336 424 256 448 C 176 424 112 368 112 280 V 136 Z" 
        fill="none" stroke="url(#primaryGrad)" stroke-width="12" stroke-linejoin="round" opacity="0.3" />

  <!-- Inner Shield Core -->
  <path d="M 256 84 L 380 148 V 272 C 380 348 324 398 256 420 C 188 398 132 348 132 272 V 148 Z" 
        fill="#0b1329" stroke="url(#primaryGrad)" stroke-width="6" stroke-linejoin="round" filter="url(#subtleGlow)" />

  <!-- Stylized 'A' Peak + Poultry Rooster Comb & Crest Motif -->
  <!-- Comb / Top Feathers -->
  <path d="M 256 120 C 275 120 290 100 282 82 C 298 92 312 88 316 72 C 328 92 342 96 348 112 C 330 114 318 126 314 140 Z" 
        fill="url(#amberGrad)" />
  <path d="M 256 120 C 237 120 222 100 230 82 C 214 92 200 88 196 72 C 184 92 170 96 164 112 C 182 114 194 126 198 140 Z" 
        fill="url(#amberGrad)" />

  <!-- Left Dynamic Wing / 'A' Leg -->
  <path d="M 256 150 L 168 320 H 215 L 242 265 H 256 Z" 
        fill="url(#primaryGrad)" />

  <!-- Right Dynamic Wing / 'A' Leg -->
  <path d="M 256 150 L 344 320 H 297 L 270 265 H 256 Z" 
        fill="url(#cyanGrad)" />

  <!-- Center Diamond / Tech Pulse Node -->
  <polygon points="256,180 282,235 256,290 230,235" fill="url(#amberGrad)" filter="url(#subtleGlow)" />
  
  <!-- Sleek Cross Bar Wave -->
  <path d="M 190 270 Q 256 240 322 270 L 334 292 Q 256 260 178 292 Z" 
        fill="url(#amberGrad)" />

  <!-- Base Growth Arc / Golden Seed Element -->
  <path d="M 190 340 C 230 365 282 365 322 340 C 310 375 278 390 256 390 C 234 390 202 375 190 340 Z" 
        fill="url(#amberGrad)" />

  <!-- Glowing Core Accent Dots -->
  <circle cx="256" cy="235" r="8" fill="#ffffff" />
  <circle cx="256" cy="330" r="5" fill="#34d399" />
</svg>
