<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Akhi Poultry Farm - Smart POS & Farm Management System 4.0 Pro</title>
  <meta name="description" content="Akhi Poultry Farm 4.0 - Enterprise Point of Sale & Complete Poultry Farm Management System">
  
  <!-- Google Fonts: Plus Jakarta Sans & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Main Styling -->
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <div id="app-container">
    <!-- Sidebar Navigation -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">🐔</div>
        <div>
          <div class="brand-title">AKHI POS</div>
          <div class="brand-subtitle">POULTRY PRO 4.0</div>
        </div>
      </div>

      <nav class="nav-list">
        <a class="nav-item active" data-view="dashboard-view">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
          <span>Dashboard</span>
        </a>

        <a class="nav-item" data-view="pos-view" style="background: linear-gradient(90deg, rgba(16,185,129,0.2), transparent); border-color: rgba(16,185,129,0.3);">
          <svg class="icon" style="color: var(--emerald-primary);" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"></path></svg>
          <span style="font-weight: 700; color: var(--emerald-primary);">Point of Sale (F2)</span>
        </a>

        <a class="nav-item" data-view="khamar-view">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
          <span>Khamar Batches</span>
        </a>

        <a class="nav-item" data-view="khamari-view">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"></path></svg>
          <span style="color: var(--gold-primary); font-weight: 700;">Daily Khamari Entry</span>
        </a>

        <a class="nav-item" data-view="feed-gura-mgmt-view">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
          <span>Feed & Gura Engine</span>
        </a>

        <a class="nav-item" data-view="inventory-view">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"></path></svg>
          <span>Products & Stock</span>
        </a>

        <a class="nav-item" data-view="customers-view">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
          <span>Customer Ledgers</span>
        </a>

        <a class="nav-item" data-view="supplier-view">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4"></path></svg>
          <span>Supplier Ledgers</span>
        </a>

        <a class="nav-item" data-view="accounting-view">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1v8m0 0v1m0-1c-1.11 0-2.08-.402-2.599-1M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span>Farm Accounting</span>
        </a>

        <a class="nav-item" data-view="loan-view">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
          <span>Loans & EMI</span>
        </a>

        <a class="nav-item" data-view="installment-view">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <span>Installments</span>
        </a>

        <a class="nav-item" data-view="analytics-view">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
          <span>Business Analytics</span>
        </a>

        <a class="nav-item" data-view="user-view">
          <svg class="icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
          <span>HR & Payroll</span>
        </a>
      </nav>
    </aside>

    <!-- Main Content Wrapper -->
    <main class="main-wrapper">
      <!-- Top Sticky Header -->
      <header class="top-header">
        <div class="header-left">
          <button id="menu-toggle" class="menu-toggle-btn">
            <svg style="width: 24px; height: 24px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path></svg>
          </button>
          <h1 id="current-page-title" class="page-title">Executive Dashboard</h1>
        </div>

        <div class="header-right">
          <div id="flock-count-badge" class="quick-badge">
            <span class="indicator"></span> 3 Active Flocks
          </div>
          <div id="stock-alert-badge" class="quick-badge" style="color: var(--emerald-primary);">
            0 Low Stock Alerts
          </div>
          <div id="header-clock" style="font-size: 0.85rem; font-weight: 600; color: var(--text-muted);">
            --:--:--
          </div>
          <button onclick="window.exportFarmData()" class="btn btn-sm btn-secondary" title="Export Backup JSON">
            💾 Backup
          </button>
          <button onclick="window.triggerImportData()" class="btn btn-sm btn-secondary" title="Restore Backup">
            📂 Import
          </button>
        </div>
      </header>

      <!-- View Containers -->
      <section class="content-area">
        <div id="dashboard-view" class="view-section active"></div>
        <div id="pos-view" class="view-section"></div>
        <div id="khamar-view" class="view-section"></div>
        <div id="khamari-view" class="view-section"></div>
        <div id="feed-gura-mgmt-view" class="view-section"></div>
        <div id="inventory-view" class="view-section"></div>
        <div id="customers-view" class="view-section"></div>
        <div id="supplier-view" class="view-section"></div>
        <div id="accounting-view" class="view-section"></div>
        <div id="loan-view" class="view-section"></div>
        <div id="installment-view" class="view-section"></div>
        <div id="analytics-view" class="view-section"></div>
        <div id="user-view" class="view-section"></div>
      </section>
    </main>
  </div>

  <!-- Entry Script Bootstrapper -->
  <script type="module">
    import { initPOSModule } from './js/modules/pos.js';
    import { initKhamarModule } from './js/modules/khamar.js';
    import { initFeedGuraModule } from './js/modules/feedGura.js';
    import { initInventoryModule } from './js/modules/inventory.js';
    import { initAccountingModule } from './js/modules/accounting.js';
    import { initAnalyticsModule } from './js/modules/analytics.js';
    import { initHRModule } from './js/modules/hr.js';

    document.addEventListener('DOMContentLoaded', () => {
      initPOSModule();
      initKhamarModule();
      initFeedGuraModule();
      initInventoryModule();
      initAccountingModule();
      initAnalyticsModule();
      initHRModule();
    });
  </script>
</body>
</html>
